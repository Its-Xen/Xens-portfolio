      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="0.5" stop-color="#8c97a9"/>
      <stop offset="1" stop-color="#dde4ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0c10"/>
